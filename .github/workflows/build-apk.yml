name: Build & Publish Debug APK

# 推送到 GitHub 后自动编译出 app-debug.apk（无需本机装 Android Studio / SDK）
# 方法对齐 islaany/BookPageMapAssistant：ubuntu 运行机已预装完整 Android SDK + JDK，自带 android-34
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report build failure to issue
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) { log = 'build.log not found'; }
            const tail = log.split('\n').slice(-200).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI build failed #' + context.runNumber,
              body: '```\n' + tail + '\n```'
            });

      - name: Publish APK to Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk
          name: Debug APK (latest)
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
