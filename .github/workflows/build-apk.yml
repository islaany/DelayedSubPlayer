name: Build & Publish Debug APK

# 推送到 GitHub 后自动编译出 app-debug.apk 并发布到 Release（tag: debug-apk）
# 方法对齐 islaany/BookPageMapAssistant：ubuntu 运行机已预装完整 Android SDK + JDK，自带 android-34
#
# 注意：仓库里提交的 gradle-wrapper.jar 在某些环境下下载为损坏的 HTML，因此本 CI 在构建前
# 用 gh api（已认证的 api.github.com，不受 raw CDN 匿名限流影响）重新拉取官方 wrapper jar 覆盖。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore valid gradle wrapper jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/gradle/gradle/contents/gradle/wrapper/gradle-wrapper.jar?ref=v8.9.0 \
            --jq '.content' | base64 -d > gradle/wrapper/gradle-wrapper.jar
          echo "jar size: $(stat -c%s gradle/wrapper/gradle-wrapper.jar)"
          if unzip -l gradle/wrapper/gradle-wrapper.jar 2>/dev/null | grep -q GradleWrapperMain; then
            echo "wrapper jar OK"
          else
            echo "BAD JAR - aborting"; exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Verify APK exists
        id: verify
        run: |
          set -euo pipefail
          FILE=$(find app/build/outputs/apk/debug -name 'app-debug.apk' | head -1)
          echo "APK=$FILE size=$(stat -c%s "$FILE")"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Publish APK to Release
        id: publish
        if: steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILE="${{ steps.verify.outputs.file }}"
          echo "Publishing $FILE"
          gh release delete debug-apk -y --cleanup-tag 2>/dev/null || true
          gh release create debug-apk "$FILE" \
            --title "Debug APK (latest)" \
            --prerelease \
            --notes "Auto-built debug APK from ${{ github.sha }}"

      - name: Diagnose on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const head = (p,n) => { try { return execSync('head -n ' + n + ' ' + p + ' 2>/dev/null || echo MISSING').toString(); } catch (e) { return String(e); } };
            const tail = (p,n) => { try { return execSync('tail -n ' + n + ' ' + p + ' 2>/dev/null || echo MISSING').toString(); } catch (e) { return String(e); } };
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI diag #' + context.runNumber + ' build failed',
              body: 'BUILD_HEAD:\n```\n' + head('build.log', 200) + '\n```\nBUILD_TAIL:\n```\n' + tail('build.log', 120) + '\n```'
            });
