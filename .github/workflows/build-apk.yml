name: Build & Publish Debug APK

# 推送到 GitHub 后自动编译出 app-debug.apk 并发布到 Release（tag: debug-apk）
# 方法对齐 islaany/BookPageMapAssistant：ubuntu 运行机已预装完整 Android SDK + JDK，自带 android-34
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Publish APK to Release
        id: publish
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          FILE=$(find app/build/outputs/apk/debug -name 'app-debug.apk' | head -1)
          echo "FILE=$FILE"
          if [ -z "$FILE" ]; then echo "APK_NOT_FOUND"; ls -laR app/build/outputs; exit 1; fi
          gh release delete debug-apk -y --cleanup-tag 2>&1 || true
          gh release create debug-apk "$FILE" \
            --title "Debug APK (latest)" \
            --prerelease \
            --notes "Auto-built debug APK from ${{ github.sha }}" 2>&1 | tee publish_result.txt

      - name: Diagnose on failure
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const buildOk = '${{ steps.build.outcome }}' === 'success';
            const pubOk = '${{ steps.publish.outcome }}' === 'success';
            if (buildOk && pubOk) { console.log('all green, skip issue'); return; }
            const { execSync } = require('child_process');
            const tail = (p) => { try { return execSync('tail -n 120 ' + p + ' 2>/dev/null || echo MISSING').toString(); } catch (e) { return String(e); } };
            const tree = (p) => { try { return execSync('ls -laR ' + p + ' 2>&1 || true').toString(); } catch (e) { return String(e); } };
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI diag #' + context.runNumber + ' build=' + buildOk + ' publish=' + pubOk,
              body: 'BUILD_TAIL:\n```\n' + tail('build.log') + '\n```\nPUBLISH:\n```\n' + tail('publish_result.txt') + '\n```\nAPK_TREE:\n```\n' + tree('app/build/outputs/apk') + '\n```'
            });
