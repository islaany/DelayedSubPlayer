name: Build & Publish Windows EXE

# 推送到 GitHub 后自动编译出 Windows 桌面版（Compose Desktop / JVM），
# 用 settings-desktop.gradle.kts 避免配置 :app 需要 Android SDK，
# 产物（便携版 zip，内含 DelayedSubPlayer.exe）发布到 Release（tag: windows-release）。
#
# 说明：
# - 播放用 VLCJ 封装 libVLC，最终用户需本机安装 VLC 播放器。
# - 字幕抽取用内嵌 ffmpeg（FfmpegExtractor 优先从 PATH / 同目录找 ffmpeg.exe；
#   若需要可把 ffmpeg.exe 放到与 exe 同目录，或在 CI 里打包进 resources）。
# - 这里用 createDistributable 产出「应用镜像」（含 exe 启动器 + 自带 JRE），
#   再压缩成 zip 发布，避免 jpackage 安装包对 WiX 的依赖，CI 更稳。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9 (official binary distribution)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-8.9-bin.zip" -OutFile "$env:TEMP\gradle-8.9-bin.zip"
          Expand-Archive -Path "$env:TEMP\gradle-8.9-bin.zip" -DestinationPath "C:\gradle" -Force
          & "C:\gradle\gradle-8.9\bin\gradle.bat" --version

      - name: Provide ffmpeg (for subtitle extraction)
        shell: pwsh
        run: |
          # 下载 Windows 版 ffmpeg 真实二进制（BtbN 构建，含 GPL 组件），稍后拷进应用镜像，
          # 这样最终用户双击 exe 即可直接抽取内嵌字幕，无需自己装 ffmpeg。
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ffmpeg.zip"
          Expand-Archive -Path "$env:TEMP\ffmpeg.zip" -DestinationPath "$env:TEMP\ffmpeg" -Force
          $ff = Get-ChildItem -Path "$env:TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ff) { throw "ffmpeg.exe not found in download" }
          echo "FFMPEG=$($ff.FullName)" >> $env:GITHUB_ENV

      - name: Build Windows distributable (app image)
        id: build
        shell: pwsh
        run: |
          & "C:\gradle\gradle-8.9\bin\gradle.bat" -c settings-desktop.gradle.kts :desktopApp:createDistributable --no-daemon 2>&1 | Tee-Object -FilePath build.log

      - name: Bundle ffmpeg into app image + package zip
        id: pkg
        shell: pwsh
        run: |
          $src = "desktopApp\build\compose\binaries\main\app\DelayedSubPlayer"
          if (-not (Test-Path $src)) { throw "app image not found at $src" }
          # 把 ffmpeg.exe 放在 exe 同目录，FfmpegExtractor 会优先从当前目录找到它
          Copy-Item -Force $env:FFMPEG "$src\ffmpeg.exe"
          Compress-Archive -Path $src -DestinationPath "DelayedSubPlayer-Windows.zip" -Force
          $size = (Get-Item "DelayedSubPlayer-Windows.zip").Length
          echo "zip size=$size"
          echo "file=DelayedSubPlayer-Windows.zip" >> $env:GITHUB_OUTPUT

      - name: Publish to Release
        id: publish
        if: steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $file = "${{ steps.pkg.outputs.file }}"
          Write-Host "Publishing $file"
          gh release delete windows-release -y --cleanup-tag 2>$null
          gh release create windows-release "$file" `
            --title "Windows EXE (latest)" `
            --notes "Auto-built Windows 桌面版（便携版：解压后运行 DelayedSubPlayer.exe，需本机安装 VLC 播放器；字幕抽取依赖 ffmpeg，请把 ffmpeg.exe 放在 exe 同目录或加入 PATH）。"

      - name: Diagnose on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) { log = 'NO BUILD LOG'; }
            const head = log.slice(0, 4000);
            const tail = log.slice(-2500);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Windows CI diag #' + context.runNumber + ' build failed',
              body: 'BUILD_HEAD:\n```\n' + head + '\n```\nBUILD_TAIL:\n```\n' + tail + '\n```'
            });
